<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgMPLS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090e1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgMPLS)"/>

  <!-- Student Welcome Graphic -->
  <g transform="translate(400, 180)">
    <!-- Central Badge -->
    <circle cx="0" cy="0" r="90" fill="url(#gradBadge)" opacity="0.3"/>
    <circle cx="0" cy="0" r="75" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Mortarboard / Hat Icon -->
    <path d="M-45 -10 L0 -35 L45 -10 L0 15 Z" fill="#38bdf8"/>
    <polygon points="0,15 0,38 35,22 35,5" fill="#0284c7"/>
    <path d="M45 -10 L48 20 L40 25 L45 -10" fill="#f59e0b"/>
    <circle cx="40" cy="25" r="4" fill="#fbbf24"/>

    <!-- Sparkles -->
    <path d="M-60 -50 L-50 -70 L-40 -50 L-20 -40 L-40 -30 L-50 -10 L-60 -30 L-80 -40 Z" fill="#fbbf24" opacity="0.8" transform="scale(0.5) translate(-100, -100)"/>
    <path d="M60 -50 L70 -70 L80 -50 L100 -40 L80 -30 L70 -10 L60 -30 L40 -40 Z" fill="#38bdf8" opacity="0.8" transform="scale(0.5) translate(80, -100)"/>
  </g>

  <!-- Tag Pill -->
  <rect x="290" y="45" width="220" height="36" rx="18" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="400" y="69" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#67e8f9" text-anchor="middle" letter-spacing="2">TAHUN AJARAN 2026/2027</text>

  <!-- Title & Subtitle -->
  <text x="400" y="365" font-family="'Outfit', sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MPLS SMK BANGUN NUSA BANGSA</text>
  <text x="400" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#a7f3d0" text-anchor="middle">Masa Pengenalan Lingkungan Sekolah Ramah &amp; Edukatif</text>
  <text x="400" y="435" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Membentuk Karakter Pelajar Vokasi Unggul, Berakhlak Mulia &amp; Siap Kerja</text>
</svg>
